<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ===== PWA & App Icon ===== -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AuraTrade" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ===== Viewport ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- ===== Primary SEO ===== -->
    <title>AuraTrade™ | Institutional Real-Time Market Workstation</title>
    <meta name="description" content="AuraTrade is a production-grade real-time stock market platform with live WebSocket price streaming, interactive multi-timeframe charts, smart price alerts, AI trading assistant, and a full paper trading portfolio simulator." />
    <meta name="keywords" content="stock market, real-time stock prices, paper trading, stock alerts, NSE, NASDAQ, live market data, trading platform, AI trading assistant, portfolio tracker" />
    <meta name="author" content="AuraTrade" />
    <meta name="robots" content="index, follow" />

    <!-- ===== Open Graph / Facebook ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuraTrade™ | Institutional Real-Time Market Workstation" />
    <meta property="og:description" content="Real-time stock market platform with live price streaming, AI analysis, smart alerts, and paper trading portfolio." />
    <meta property="og:site_name" content="AuraTrade" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuraTrade™ | Real-Time Market Workstation" />
    <meta name="twitter:description" content="Live stock prices, AI trading assistant, smart alerts & paper trading — all in one professional platform." />

    <!-- ===== Security / Privacy Policy via Meta ===== -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ===== Structured Data ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AuraTrade",
      "description": "Real-time institutional stock market workstation with live WebSocket prices, AI analysis, price alerts, and paper trading.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- ===== Typography ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
